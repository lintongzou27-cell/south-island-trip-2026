function applyTheme(){let h=new Date().getHours();document.documentElement.classList.toggle('dark',h<7||h>=19)}applyTheme();setInterval(applyTheme,60000);$('#theme').onclick=()=>document.documentElement.classList.toggle('dark');$('#lang').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.trip_lang=lang;render()};$('#hero').onerror=()=>{$('#hero').style.display='none';$('#heroFallback').style.display='block'};
function routeUrl(route){let a=route.map(k=>P[k]).filter(Boolean);if(a.length<2)return'#';let u='https://www.google.com/maps/dir/?api=1&travelmode=driving&origin='+encodeURIComponent(a[0].q)+'&destination='+encodeURIComponent(a.at(-1).q);if(a.length>2)u+='&waypoints='+encodeURIComponent(a.slice(1,-1).map(p=>p.q).join('|'));return u}function embed(route){let a=route.map(k=>P[k]).filter(Boolean);if(a.length<2)return'https://maps.google.com/maps?output=embed&q='+encodeURIComponent(a[0]?.q||'');return'https://maps.google.com/maps?output=embed&hl='+(lang==='zh'?'zh-CN':'en')+'&saddr='+encodeURIComponent(a[0].q)+'&daddr='+encodeURIComponent(a.slice(1).map(p=>p.q).join(' to:'))}function mapQ(p){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.q)}function phone(x){return'tel:'+String(x).replace(/[^+\d]/g,'')}
function drawFallback(c,route){let ps=route.map(k=>P[k]).filter(Boolean),ctx=c.getContext('2d'),w=c.clientWidth||800,h=300,dpr=Math.min(2,devicePixelRatio||1);c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#d8ecef';ctx.fillRect(0,0,w,h);if(!ps.length)return;let lats=ps.map(p=>p.lat),lons=ps.map(p=>p.lon),a=Math.min(...lats),b=Math.max(...lats),x=Math.min(...lons),y=Math.max(...lons);let xy=p=>[30+(p.lon-x)/(Math.max(.01,y-x))*(w-60),30+(b-p.lat)/(Math.max(.01,b-a))*(h-60)];ctx.strokeStyle='#247f75';ctx.lineWidth=5;ctx.beginPath();ps.map(xy).forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();ps.forEach((p,i)=>{let [xx,yy]=xy(p);ctx.fillStyle='#203238';ctx.beginPath();ctx.arc(xx,yy,6,0,7);ctx.fill();ctx.font='700 11px system-ui';ctx.fillText(t(p.n),xx+9,yy-8)})}

function bookCard(b){let ph=typeof b.ph==='object'?t(b.ph):b.ph;let isNum=/\d/.test(ph)&&!ph.includes('未公开')&&!ph.includes('Private');return`<div class="booking"><div class="btitle">${b.type} ${bi(b.t)}</div><div class="meta">${bi(b.d)}</div><div class="row"><b>${bi(UI.time)}</b>${bi(b.w)}</div><div class="row"><b>${bi(UI.address)}</b>${bi(b.a)}</div><div class="row"><b>${bi(UI.phone)}</b>${esc(ph)}</div><div class="links"><button class="smallbtn" onclick="openPlace('${b.p}')">ⓘ ${bi(P[b.p].n)}</button>${isNum?`<a class="smallbtn" href="${phone(ph)}">☎ ${esc(ph)}</a>`:''}</div></div>`}function renderDay(d,i){let [n,total]=prog(d),bs=B.filter(b=>b.days.includes(d.id)),stay=d.stay?P[d.stay]:null;let ev=d.ev.map(e=>{let done=localStorage['ck_'+e.id]==='1',dr=d.dr?.[e.id]?`<div class="driveRow"><span class="drive">${bi(d.dr[e.id])}</span></div>`:'',tags=e.tags.map(k=>`<span class="tag ${k}">${bi(tagN[k]||Z(k,k))}</span>`).join('');return`${dr}<div class="item ${done?'done':''}" style="--day:${d.color}"><div class="time">${e.time}<span class="tz">${e.tz}</span></div><div class="ebox"><button class="pt" onclick="openPlace('${e.place}')">${bi(e.title)} ⓘ</button><div class="note">${bi(e.note)}</div><div class="bottom"><div class="tags">${tags}</div><button class="check" onclick="toggle('${e.id}')">${bi(done?UI.checked:UI.check)}</button></div></div></div>`}).join('');return`<article class="day ${i===0?'open':''}" id="d${d.id}" style="--day:${d.color}"><div class="dayhead" onclick="this.parentElement.classList.toggle('open')"><div class="bar"></div><div><div class="daytitle">${bi(d.label)}</div><div class="daysub">${stay?bi(UI.stay)+' · '+bi(stay.n):''}</div></div><div><span class="progress">${n}/${total}</span>⌄</div></div><div class="body"><div class="actions"><button class="btn" onclick="showDayMap('${d.id}');event.stopPropagation()">🗺️ <span id="ml${d.id}">${bi(UI.route)}</span></button><a class="btn" href="${routeUrl(d.route)}" target="_blank">↗ ${bi(UI.multi)}</a></di window.showDayMap=id=>{let d=D.find(x=>x.id===id),box=$('#dm'+id),lab=$('#ml'+id);box.classList.toggle('show');lab.innerHTML=bi(box.classList.contains('show')?UI.hide:UI.route);if(box.classList.contains('show'))setupMap($('#mw'+id),$('#gm'+id),$('#fm'+id),d.route)};window.openPlace=id=>{let p=P[id];if(!p)return;$('#mcat').innerHTML=bi(p.c);$('#mname').innerHTML=bi(p.n);$('#mreason').innerHTML=bi(p.r);$('#mmust').innerHTML=p.m.map(x=>`<li>${bi(x)}</li>`).join('');$('#mexp').innerHTML=p.x.map(x=>`<li>${bi(x)}</li>`).join('');$('#mprac').innerHTML=bi(p.p);$('#mmap').href=mapQ(p);$('#modal').classList.add('show')};$('#close').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};
function countdown(){let now=Date.now(),x=schedule.find(s=>new Date(s[0]).getTime()>now);if(!x){$('#nextTitle').innerHTML=bi(UI.done);$('#nextWhen').textContent='';$('#nextTz').textContent='';$('#count').textContent='✓';return}let target=new Date(x[0]).getTime(),q=Math.max(0,Math.floor((target-now)/1000)),d=Math.floor(q/86400),h=Math.floor(q%86400/3600),m=Math.floor(q%3600/60),s=q%60;$('#nextTitle').innerHTML=bi(x[1]);$('#nextWhen').textContent=new Intl.DateTimeFormat(lang==='zh'?'zh-CN':'en-AU',{dateStyle:'medium',timeStyle:'short',timeZone:x[2]==='NZDT'?'Pacific/Auckland':'Australia/Brisbane'}).format(new Date(target));$('#nextTz').textContent=x[2];$('#count').textContent=[d,h,m,s].map(v=>String(v).padStart(2,'0')).join(':')}
