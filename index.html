<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f1e8" />
    <title>2026 新西兰南岛家庭旅行手册</title>
    <style>
      :root {
        --bg: #f4f1e8;
        --card: #fffdf8;
        --ink: #203238;
        --muted: #69787b;
        --line: #d9dfd8;
        --accent: #247f75;
        --soft: #e9f3ef;
        --chip: #eef0e8;
        --warn: #fff1d7;
        --ok: #e7f4ec;
        --shadow: 0 12px 34px #22333817;
      }
      html.dark {
        --bg: #101719;
        --card: #172124;
        --ink: #eef5f2;
        --muted: #a8b6b3;
        --line: #314044;
        --soft: #1f3433;
        --chip: #253033;
        --warn: #3b2f18;
        --ok: #173425;
        --shadow: 0 12px 34px #0007;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
      }
      .shell {
        width: min(1120px, calc(100% - 24px));
        margin: auto;
        padding: 14px 0 70px;
      }
      .topbar {
        position: sticky;
        top: 7px;
        z-index: 20;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      .brand,
      .controls button {
        background: color-mix(in srgb, var(--card) 92%, transparent);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
        border-radius: 999px;
        padding: 9px 12px;
        color: var(--ink);
        font-weight: 800;
      }
      .controls {
        display: flex;
        gap: 7px;
      }
      .controls button {
        cursor: pointer;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 21px;
        padding: 17px;
        box-shadow: var(--shadow);
      }
      .focus {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: center;
      }
      .focus small {
        color: var(--muted);
        font-weight: 800;
      }
      .focus .event {
        font-size: 20px;
        font-weight: 900;
        margin-top: 4px;
      }
      .focus .when {
        color: var(--muted);
      }
      .count {
        font-size: clamp(27px, 7vw, 52px);
        font-weight: 950;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.04em;
      }
      .countlab {
        color: var(--muted);
        font-size: 11px;
        text-align: right;
      }
      .hero {
        margin: 14px 0 23px;
        border-radius: 27px;
        overflow: hidden;
        position: relative;
        box-shadow: var(--shadow);
        background: var(--card);
      }
      .hero img {
        display: block;
        width: 100%;
        height: min(52vw, 490px);
        min-height: 290px;
        object-fit: cover;
      }
      .heroFallback {
        display: none;
        height: 340px;
        background: linear-gradient(#bfe3ee, #f8e7c5);
        position: relative;
      }
      .heroFallback:before {
        content: "AORAKI · SOUTH ISLAND";
        position: absolute;
        left: 7%;
        top: 13%;
        font-size: clamp(24px, 5vw, 46px);
        font-weight: 950;
        color: #314a51;
      }
      .heroFallback:after {
        content: "▲     ▲▲       ▲";
        position: absolute;
        left: 12%;
        bottom: 18%;
        font-size: clamp(55px, 15vw, 150px);
        color: #7f9883;
        letter-spacing: -0.18em;
      }
      .overlay {
        position: absolute;
        inset: auto 0 0;
        padding: 70px 20px 17px;
        color: #fff;
        background: linear-gradient(transparent, #0b1b20d9);
      }
      .overlay h1 {
        font-size: clamp(28px, 6vw, 48px);
        line-height: 1.05;
        margin: 0 0 6px;
      }
      .credit {
        font-size: 11px;
        opacity: 0.85;
        margin-top: 7px;
      }
      .credit a {
        color: #fff;
      }
      .zh {
        font-weight: inherit;
      }
      .en {
        display: block;
        font-size: 0.78em;
        color: var(--muted);
        font-weight: 600;
        margin-top: 2px;
        line-height: 1.25;
      }
      .overlay .en {
        color: #ffffffd0;
      }
      .trip {
        margin-top: 24px;
        border: 1px solid var(--line);
        border-radius: 27px;
        padding: 17px;
        background: color-mix(in srgb, var(--card) 62%, transparent);
      }
      .kicker {
        font-size: 11px;
        letter-spacing: 0.12em;
        font-weight: 900;
        color: var(--accent);
      }
      h2 {
        font-size: clamp(25px, 5vw, 39px);
        line-height: 1.15;
        margin: 3px 0;
      }
      .dates {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 12px;
      }
      .mapwrap {
        border-radius: 17px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: #dcebee;
      }
      .gmap {
        width: 100%;
        height: 330px;
        border: 0;
        display: block;
      }
      .fallbackMap {
        display: none;
        width: 100%;
        height: 300px;
      }
      .offline .gmap {
        display: none;
      }
      .offline .fallbackMap {
        display: block;
      }
      .mapbar {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        padding: 7px 10px;
        border-radius: 11px;
        text-decoration: none;
        font-weight: 800;
        cursor: pointer;
      }
      .mapnote {
        font-size: 12px;
        color: var(--muted);
        margin: 7px 2px 0;
      }
      .days {
        display: grid;
        gap: 11px;
        margin-top: 12px;
      }
      .day {
        border: 1px solid var(--line);
        border-radius: 19px;
        background: var(--card);
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .dayhead {
        display: grid;
        grid-template-columns: 9px 1fr auto;
        gap: 11px;
        align-items: center;
        padding: 14px;
        cursor: pointer;
      }
      .bar {
        height: 44px;
        border-radius: 8px;
        background: var(--day);
      }
      .daytitle {
        font-size: 17px;
        font-weight: 950;
      }
      .daysub {
        font-size: 12px;
        color: var(--muted);
      }
      .progress {
        background: var(--chip);
        border-radius: 999px;
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 850;
      }
      .body {
        display: none;
        padding: 0 14px 15px;
      }
      .day.open .body {
        display: block;
      }
      .actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .dmap {
        display: none;
        margin-bottom: 12px;
      }
      .dmap.show {
        display: block;
      }
      .dmap .gmap {
        height: 270px;
      }
      .timeline {
        position: relative;
      }
      .timeline:before {
        content: "";
        position: absolute;
        left: 70px;
        top: 6px;
        bottom: 7px;
        width: 1px;
        background: var(--line);
      }
      .item {
        display: grid;
        grid-template-columns: 57px 1fr;
        gap: 26px;
        padding: 8px 0 12px;
        position: relative;
      }
      .item.done {
        opacity: 0.42;
      }
      .time {
        text-align: right;
        font-weight: 950;
        font-variant-numeric: tabular-nums;
      }
      .tz {
        display: block;
        font-size: 10px;
        color: var(--muted);
      }
      .ebox {
        position: relative;
      }
      .ebox:before {
        content: "";
        position: absolute;
        left: -31px;
        top: 8px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--day);
        border: 3px solid var(--card);
        box-shadow: 0 0 0 1px var(--line);
      }
      .pt {
        font-weight: 900;
        background: none;
        border: 0;
        padding: 0;
        color: inherit;
        text-align: left;
        text-decoration: underline dotted;
        text-underline-offset: 3px;
        cursor: pointer;
      }
      .note {
        font-size: 13px;
        color: var(--muted);
        margin-top: 3px;
      }
      .bottom {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      .tags {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .tag,
      .drive,
      .pill {
        display: inline-flex;
        border-radius: 999px;
        padding: 4px 8px;
        background: var(--chip);
        font-size: 11px;
        font-weight: 800;
      }
      .tag.notice,
      .tag.reserve {
        background: var(--warn);
      }
      .tag.booked,
      .tag.confirmed {
        background: var(--ok);
        color: var(--accent);
      }
      .check {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 9px;
        padding: 4px 8px;
        cursor: pointer;
        font-size: 11px;
      }
      .driveRow {
        margin: -2px 0 5px 82px;
      }
      .drive {
        border: 1px solid var(--line);
        background: var(--soft);
        color: var(--muted);
      }
      .confirmed {
        border-top: 1px solid var(--line);
        padding-top: 13px;
        margin-top: 12px;
      }
      .confirmed h3 {
        margin: 0 0 8px;
      }
      .bookgrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .booking {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        background: color-mix(in srgb, var(--card) 85%, var(--soft));
      }
      .btitle {
        font-weight: 900;
      }
      .meta,
      .row {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 5px;
      }
      .row b {
        display: inline-block;
        min-width: 42px;
        color: var(--ink);
      }
      .links {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 7px;
      }
      .smallbtn {
        border: 0;
        background: var(--soft);
        color: var(--ink);
        border-radius: 9px;
        padding: 5px 8px;
        text-decoration: none;
        font-weight: 800;
        cursor: pointer;
      }
      .stay {
        margin-top: 10px;
        padding: 11px;
        border-radius: 13px;
        background: var(--soft);
        border: 1px dashed var(--line);
      }
      .section {
        margin-top: 20px;
      }
      .section h2 {
        font-size: 26px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .list ul {
        padding-left: 20px;
        margin: 8px 0 0;
      }
      .list li {
        margin: 8px 0;
      }
      .tips {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }
      .tip {
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-left: 4px solid var(--accent);
        border-radius: 0 13px 13px 0;
        background: var(--card);
      }
      .footer {
        margin: 25px auto 0;
        max-width: 820px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 50;
        background: #071012a8;
        padding: 15px;
        align-items: flex-end;
        justify-content: center;
      }
      .modal.show {
        display: flex;
      }
      .mcard {
        width: min(670px, 100%);
        max-height: 84vh;
        overflow: auto;
        background: var(--card);
        border-radius: 22px;
        padding: 17px;
      }
      .mtop {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .close {
        border: 0;
        background: var(--chip);
        color: var(--ink);
        width: 35px;
        height: 35px;
        border-radius: 50%;
        font-size: 20px;
      }
      .cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .mcard h3 {
        font-size: 23px;
        margin: 4px 0;
      }
      .mcard h4 {
        margin: 13px 0 4px;
      }
      .mcard ul {
        padding-left: 20px;
        margin: 4px 0;
      }
      @media (max-width: 750px) {
        .grid,
        .bookgrid,
        .tips {
          grid-template-columns: 1fr;
        }
        .gmap {
          height: 280px;
        }
        .hero img {
          height: 330px;
        }
      }
      @media (max-width: 580px) {
        .focus {
          grid-template-columns: 1fr;
        }
        .countlab {
          text-align: left;
        }
        .timeline:before {
          left: 62px;
        }
        .item {
          grid-template-columns: 49px 1fr;
        }
        .driveRow {
          margin-left: 74px;
        }
        .overlay {
          padding: 60px 15px 14px;
        }
      }
    </style>
    <style>
      .tag {
        border: 0;
        color: inherit;
        cursor: pointer;
        transition: 0.15s ease;
        align-items: center;
      }
      .tag:after {
        content: "⌄";
        margin-left: 4px;
        font-size: 0.9em;
      }
      .tag:hover,
      .tag:focus-visible {
        transform: translateY(-1px);
        outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
        outline-offset: 1px;
      }
      .tagpanel {
        display: none;
        margin-top: 8px;
        padding: 10px 11px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--soft);
        font-size: 13px;
      }
      .tagpanel.show {
        display: block;
      }
      .tagpanel p {
        margin: 0 0 7px;
      }
      .doclinks {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .docbtn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 9px;
        padding: 6px 9px;
        text-decoration: none;
        font-weight: 850;
      }
      .docbtn:hover {
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <div class="brand">🧭 <span id="brand"> </span></div>
        <div class="controls">
          <button id="lang">EN</button>
          <button id="theme">◐</button>
        </div>
      </div>
      <section class="card focus">
        <div>
          <small id="focus"> </small>
          <div class="event" id="nextTitle">—</div>
          <div class="when" id="nextWhen">—</div>
          <div>
            <span class="pill" id="nextTz">—</span>
            <span class="pill" id="tzsafe"> </span>
          </div>
        </div>
        <div>
          <div class="count" id="count">--:--:--</div>
          <div class="countlab" id="countlab"></div>
        </div>
      </section>
      <figure class="hero">
        <img
          id="hero"
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Mt_Cook_from_Lake_Pukaki%2C_New_Zealand.jpg/1280px-Mt_Cook_from_Lake_Pukaki%2C_New_Zealand.jpg"
          alt="Lake Pukaki and Aoraki Mount Cook"
        />
        <div class="heroFallback" id="heroFallback"></div>
        <figcaption class="overlay">
          <h1 id="heroTitle"></h1>
          <div id="heroSub"></div>
          <div class="credit">
            <span id="credit"> </span> ·
            <a
              href="https://commons.wikimedia.org/wiki/File:Mt_Cook_from_Lake_Pukaki,_New_Zealand.jpg"
              target="_blank"
              >Wikimedia Commons</a
            >
            · CC BY-SA
          </div>
        </figcaption>
      </figure>
      <section class="trip">
        <div class="kicker">NEW ZEALAND · SOUTH ISLAND</div>
        <h2 id="nzTitle"></h2>
        <div class="dates">2026.09.29 — 2026.10.09</div>
        <div class="card">
          <div class="mapwrap" id="nzMapWrap">
            <iframe class="gmap" id="nzMap" loading="lazy"> </iframe>
            <canvas class="fallbackMap" id="nzFallback"> </canvas>
          </div>
          <div class="mapbar">
            <a class="btn" id="nzNav" target="_blank"> </a>
          </div>
          <div class="mapnote" id="mapnote2"></div>
        </div>
        <div class="days" id="nzDays"></div>
      </section>
      <section class="section grid">
        <div class="card list">
          <h2 id="remTitle"></h2>
          <ul id="reminders"></ul>
        </div>
        <div class="card list">
          <h2 id="todoTitle"></h2>
          <div class="meta" id="todoSub"></div>
          <ul id="todos"></ul>
        </div>
      </section>
      <section class="section">
        <h2 id="tipsTitle"></h2>
        <div class="tips" id="tips"></div>
      </section>
      <div class="footer" id="footer"></div>
    </div>
    <div class="modal" id="modal">
      <div class="mcard">
        <div class="mtop">
          <div>
            <span class="pill" id="mcat"> </span>
            <h3 id="mname"></h3>
          </div>
          <button class="close" id="close">×</button>
        </div>
        <a class="btn" id="mmap" target="_blank">↗ Google Maps</a>
        <p id="mreason"></p>
        <div class="cols">
          <div>
            <h4 id="mustTitle"></h4>
            <ul id="mmust"></ul>
          </div>
          <div>
            <h4 id="expTitle"></h4>
            <ul id="mexp"></ul>
          </div>
        </div>
        <h4 id="pracTitle"></h4>
        <p class="meta" id="mprac"></p>
      </div>
    </div>

          "https://www.google.com/maps/search/?api=1&query=" +
          encodeURIComponent(p.q)
        );
      }
      function phone(x) {
        return "tel:" + String(x).replace(/[^+\d]/g, "");
      }
      function drawFallback(c, route) {
        let ps = route.map((k) => P[k]).filter(Boolean),
          ctx = c.getContext("2d"),
          w = c.clientWidth || 800,
          h = 300,
          dpr = Math.min(2, devicePixelRatio || 1);
        c.width = w * dpr;
        c.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = "#d8ecef";
        ctx.fillRect(0, 0, w, h);
        if (!ps.length) return;
        let lats = ps.map((p) => p.lat),
          lons = ps.map((p) => p.lon),
          a = Math.min(...lats),
          b = Math.max(...lats),
          x = Math.min(...lons),
          y = Math.max(...lons);
        let xy = (p) => [
          30 + ((p.lon - x) / Math.max(0.01, y - x)) * (w - 60),
          30 + ((b - p.lat) / Math.max(0.01, b - a)) * (h - 60),
        ];
        ctx.strokeStyle = "#247f75";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ps.map(xy).forEach((p, i) => (i ? ctx.lineTo(...p) : ctx.moveTo(...p)));
        ctx.stroke();
        ps.forEach((p, i) => {
          let [xx, yy] = xy(p);
          ctx.fillStyle = "#203238";
          ctx.beginPath();
          ctx.arc(xx, yy, 6, 0, 7);
          ctx.fill();
          ctx.font = "700 11px system-ui";
          ctx.fillText(t(p.n), xx + 9, yy - 8);
        });
      }
      function setupMap(wrap, frame, canvas, route) {
        let off = !navigator.onLine;
        wrap.classList.toggle("offline", off);
        if (off) drawFallback(canvas, route);
        else frame.src = embed(route);
      }
      function prog(d) {
        let n = 0;
        d.ev.forEach((e) => (n += localStorage["ck_" + e.id] === "1"));
        return [n, d.ev.length];
      }
      function toggle(id) {
        localStorage["ck_" + id] = localStorage["ck_" + id] === "1" ? "0" : "1";
        renderDays();
      }
      function bookCard(b) {
        let ph = typeof b.ph === "object" ? t(b.ph) : b.ph;
        let isNum =
          /\d/.test(ph) && !ph.includes("未公开") && !ph.includes("Private");
        return `<div class="booking">
<div class="btitle">${b.type} ${bn(b.t)}</div>
<div class="meta">${bi(b.d)}</div>
<div class="row">
<b>${bi(UI.time)}</b>${bi(b.w)}</div>
<div class="row">
<b>${bi(UI.address)}</b>${bi(b.a)}</div>
<div class="row">
<b>${bi(UI.phone)}</b>${esc(ph)}</div>
<div class="links">
<button class="smallbtn" onclick="openPlace('${b.p}')">ⓘ ${bn(P[b.p].n)}</button>${isNum ? `<a class="smallbtn" href="${phone(ph)}">☎ ${esc(ph)}</a>` : ""}${docLinks(DOCS[b.id] || [])}</div>
</div>`;
      }
      function renderDay(d, i) {
        let [n, total] = prog(d),
          bs = B.filter((b) => b.days.includes(d.id)),
          stay = d.stay ? P[d.stay] : null;
        let ev = d.ev
          .map((e) => {
            let done = localStorage["ck_" + e.id] === "1",
              dr = d.dr?.[e.id]
                ? `<div class="driveRow">
<span class="drive">${bi(d.dr[e.id])}</span>
</div>`
                : "",
              tags = e.tags
                .map(
                  (k) =>
                    `<button type="button" class="tag ${k}" onclick="toggleTag('${e.id}','${k}',this);event.stopPropagation()">${bi(tagN[k] || Z(k, k))}</button>`,
                )
                .join("");
            return `${dr}<div class="item ${done ? "done" : ""}" style="--day:${d.color}">
<div class="time">${e.time}<span class="tz">${e.tz}</span>
</div>
<div class="ebox">
<button class="pt" onclick="openPlace('${e.place}')">${eventName(e)} ⓘ</button>
<div class="note">${bi(e.note)}</div>
<div class="bottom">
<div class="tags">${tags}</div>
<button class="check" onclick="toggle('${e.id}')">${bi(done ? UI.checked : UI.check)}</button>
</div>
<div class="tagpanel" id="tp${e.id}"></div>
</div>
</div>`;
          })
          .join("");
        return `<article class="day ${i === 0 ? "open" : ""}" id="d${d.id}" style="--day:${d.color}">
<div class="dayhead" onclick="this.parentElement.classList.toggle('open')">
<div class="bar">
</div>
<div>
<div class="daytitle">${bi(d.label)}</div>
<div class="daysub">${stay ? bi(UI.stay) + " · " + bn(stay.n) : ""}</div>
</div>
<div>
<span class="progress">${n}/${total}</span>⌄</div>
</div>
<div class="body">
${
  d.route.length > 1
    ? `<div class="actions">
<button class="btn" onclick="showDayMap('${d.id}');event.stopPropagation()">🗺️ <span id="ml${d.id}">${bi(UI.route)}</span>
</button>
<a class="btn" href="${routeUrl(d.route)}" target="_blank">↗ ${bi(UI.multi)}</a>
</div>`
    : ""
}
<div class="dmap" id="dm${d.id}">
<div class="mapwrap" id="mw${d.id}">
<iframe class="gmap" id="gm${d.id}" loading="lazy">
</iframe>
<canvas class="fallbackMap" id="fm${d.id}">
</canvas>
</div>
</div>
<div class="timeline">${ev}</div>${
          bs.length
            ? `<div class="confirmed">
<h3>${bi(UI.confirmed)}</h3>
<div class="bookgrid">${bs.map(bookCard).join("")}</div>
</div>`
            : ""
        }${
          stay
            ? `<div class="stay">
<b>🏠 ${bi(UI.stay)} · <button class="pt" onclick="openPlace('${d.stay}')">${bn(stay.n)} ⓘ</button>
</b>
<div class="meta">${bi(stay.p)}</div>
</div>`
            : ""
        }</div>
</article>`;
      }
      function renderDays() {
        let nz = D.filter((d) => d.reg === "NZ");
        $("#nzDays").innerHTML = nz.map(renderDay).join("");
      }
      window.toggleTag = (id, k, btn) => {
        let e = D.flatMap((d) => d.ev).find((x) => x.id === id),
          panel = $("#tp" + id);
        if (!e || !panel) return;
        let docs = docsFor(e),
          p = P[e.place],
          content = "";
        if (k === "nav")
          content = `<p>${lang === "en" ? "Open this stop in Google Maps." : "打开这一站的 Google Maps 导航。"}</p><div class="doclinks"><a class="docbtn" href="${mapQ(p)}" target="_blank" rel="noopener">↗ Google Maps</a></div>`;
        else if (
          (k === "booked" || k === "confirmed" || k === "stay") &&
          docs.length
        )
          content = `<p>${bi(e.note)}</p>${docLinks(docs)}`;
        else if (k === "flight")
          content = `<p>${bi(e.note)}</p>${docLinks(docs)}`;
        else
          content = `<p>${bi(e.note)}</p>${docs.length ? docLinks(docs) : `<button class="docbtn" onclick="openPlace('${e.place}')">ⓘ ${bn(p.n)}</button>`}`;
        let opening =
          !panel.classList.contains("show") || panel.dataset.tag !== k;
        document.querySelectorAll(".tagpanel.show").forEach((x) => {
          if (x !== panel) x.classList.remove("show");
        });
        panel.innerHTML = content;
        panel.dataset.tag = k;
        panel.classList.toggle("show", opening);
        btn.setAttribute("aria-expanded", String(opening));
      };
      window.showDayMap = (id) => {
        let d = D.find((x) => x.id === id),
          box = $("#dm" + id),
          lab = $("#ml" + id);
        box.classList.toggle("show");
        lab.innerHTML = bi(box.classList.contains("show") ? UI.hide : UI.route);
        if (box.classList.contains("show"))
          setupMap($("#mw" + id), $("#gm" + id), $("#fm" + id), d.route);
      };
      window.openPlace = (id) => {
        let p = P[id];
        if (!p) return;
        $("#mcat").innerHTML = bi(p.c);
        $("#mname").innerHTML = bn(p.n);
        $("#mreason").innerHTML = bi(p.r);
        $("#mmust").innerHTML = p.m.map((x) => `<li>${bi(x)}</li>`).join("");
        $("#mexp").innerHTML = p.x.map((x) => `<li>${bi(x)}</li>`).join("");
        $("#mprac").innerHTML = bi(p.p);
        $("#mmap").href = mapQ(p);
        $("#modal").classList.add("show");
      };
      $("#close").onclick = () => $("#modal").classList.remove("show");
      $("#modal").onclick = (e) => {
        if (e.target.id === "modal") $("#modal").classList.remove("show");
      };
      function countdown() {
        let now = Date.now(),
          x = schedule.find((s) => new Date(s[0]).getTime() > now);
        if (!x) {
          $("#nextTitle").innerHTML = bi(UI.done);
          $("#nextWhen").textContent = "";
          $("#nextTz").textContent = "";
          $("#count").textContent = "✓";
          return;
        }
        let target = new Date(x[0]).getTime(),
          q = Math.max(0, Math.floor((target - now) / 1000)),
          d = Math.floor(q / 86400),
          h = Math.floor((q % 86400) / 3600),
          m = Math.floor((q % 3600) / 60),
          s = q % 60;
        $("#nextTitle").innerHTML = bi(x[1]);
        $("#nextWhen").textContent = new Intl.DateTimeFormat(
          lang === "zh" ? "zh-CN" : "en-AU",
          {
            dateStyle: "medium",
            timeStyle: "short",
            timeZone:
              x[2] === "NZDT" ? "Pacific/Auckland" : "Australia/Brisbane",
          },
        ).format(new Date(target));
        $("#nextTz").textContent = x[2];
        $("#count").textContent = [d, h, m, s]
          .map((v) => String(v).padStart(2, "0"))
          .join(":");
      }
      function renderStatic() {
        let pairs = {
          brand: "brand",
          focus: "focus",
          tzsafe: "tzsafe",
          countlab: "countlab",
          heroTitle: "heroTitle",
          heroSub: "heroSub",
          credit: "credit",
          nzTitle: "nzTitle",
          rem: "remTitle",
          todo: "todoTitle",
          todoSub: "todoSub",
          tips: "tipsTitle",
          footer: "footer",
          must: "mustTitle",
          exp: "expTitle",
          prac: "pracTitle",
        };
        Object.entries(pairs).forEach(
          ([k, id]) => ($("#" + id).innerHTML = bi(UI[k])),
        );
        $("#lang").textContent = lang === "zh" ? "EN" : "中文";
        $("#nzNav").innerHTML = bi(UI.nav);
        $("#mapnote2").innerHTML = bi(UI.mapnote);
        $("#nzNav").href = routeUrl([
          "adina",
          "oamaru",
          "scenic",
          "nugget",
          "qstay",
          "glen",
          "wstay",
          "mtcook",
          "tekapo",
          "novotel",
          "kaikoura",
          "novotel",
        ]);
      }
      function maps() {
        setupMap($("#nzMapWrap"), $("#nzMap"), $("#nzFallback"), [
          "adina",
          "oamaru",
          "scenic",
          "nugget",
          "qstay",
          "glen",
          "wstay",
          "mtcook",
          "tekapo",
          "novotel",
          "kaikoura",
          "novotel",
        ]);
      }
      function render() {
        document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        renderStatic();
        renderDays();
        $("#reminders").innerHTML = reminders
          .map((x) => `<li>${bi(x)}</li>`)
          .join("");
        $("#todos").innerHTML = todos.map((x) => `<li>${bi(x)}</li>`).join("");
        $("#tips").innerHTML = tips
          .map(
            (x, i) => `<div class="tip">
<b>${String(i + 1).padStart(2, "0")}</b> · ${bi(x)}</div>`,
          )
          .join("");
        maps();
        countdown();
      }
      render();
      setInterval(countdown, 1000);
      window.addEventListener("online", maps);
      window.addEventListener("offline", maps);
    </script>
  </body>
</html>
